    <style>
        /* THEME VARIABLES */
        :root {
            /* Light Mode (Mist) */
            --color-base: #F0F4F2;
            --color-surface: #FFFFFF;
            --color-mist: #0C1C15; /* Text becomes dark */
            --color-stone: #5C6B64;
        }

        .dark {
            /* Dark Mode (Deep Forest) */
            --color-base: #0C1C15;
            --color-surface: #14261F;
            --color-mist: #E8EFEA; /* Text becomes light */
            --color-stone: #8B9792;
        }

        body {
            background-color: var(--color-base);
            color: var(--color-mist);
            transition: background-color 0.5s ease, color 0.5s ease;
            cursor: none;
        }
        
        .glass-forest {
            background: var(--color-surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(107, 142, 107, 0.1);
            transition: all 0.5s ease;
        }

        .glass-forest:hover {
            border-color: rgba(107, 142, 107, 0.25);
            transform: translateY(-2px);
        }

        .nav-btn {
            position: relative;
            padding-bottom: 4px;
        }
        
        .nav-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0%;
            height: 1px;
            background-color: #6B8E6B; /* Moss */
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-btn:hover::after, .nav-btn.active::after {
            width: 100%;
        }

        .bond-switches {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bond-switch {
            position: relative;
            width: 36px;
            height: 18px;
            background: rgba(12, 28, 21, 0.2);
            border: 1px solid rgba(107, 142, 107, 0.35);
            border-radius: 999px;
            box-shadow: inset 0 0 6px rgba(12, 28, 21, 0.3);
        }

        .bond-switch input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .bond-switch .bond-lever {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: #E8EFEA;
            box-shadow: 0 2px 6px rgba(12, 28, 21, 0.3);
            transition: transform 0.2s ease;
        }

        .bond-switch input:checked + .bond-lever {
            transform: translateX(18px);
            background: #6B8E6B;
        }

        .bond-label {
            font-size: 9px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--color-stone);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        .orbit-pinned .orbital-option {
            opacity: 1;
            pointer-events: auto;
        }

        .orbit-pinned .orbital-option-contents {
            transform: scale(1);
        }

        /* 3D Tilt Effect CSS */
        .tilt-card {
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }
        
        .tilt-inner {
            transform: translateZ(20px);
        }

        /* Custom scrollbar */
        .hide-scroll::-webkit-scrollbar {
            display: none;
        }
        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .custom-cursor-dot,
        .custom-cursor-ring {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 60;
            transform: translate(-50%, -50%);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .custom-cursor-dot {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: var(--color-mist);
        }

        .custom-cursor-ring {
            width: 36px;
            height: 36px;
            border-radius: 999px;
            border: 1px solid var(--color-mist);
            opacity: 0.6;
        }

        .custom-cursor-ring.is-hover {
            transform: translate(-50%, -50%) scale(1.6);
            opacity: 0.25;
        }

        .runaway-contact {
            position: fixed;
            z-index: 40;
            padding: 10px 18px;
            border-radius: 999px;
            border: 1px solid rgba(107, 142, 107, 0.35);
            background: rgba(255, 255, 255, 0.9);
            color: var(--color-mist);
            font-family: "DM Sans", sans-serif;
            font-size: 12px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            transition: transform 0.4s ease, left 1.2s ease, top 1.2s ease, opacity 0.4s ease;
            backdrop-filter: blur(6px);
            cursor: pointer;
        }

        .dark .runaway-contact {
            background: rgba(20, 38, 31, 0.9);
            border-color: rgba(136, 0, 21, 0.35);
        }

        .runaway-contact.is-caught {
            background: #6B8E6B;
            border-color: #6B8E6B;
            color: #FFFFFF;
        }

        .runaway-contact.is-docked {
            position: static;
            transform: none;
            transition: none;
            padding: 6px 10px;
            font-size: 10px;
            letter-spacing: 0.2em;
            animation: dock-pulse 0.9s ease-out;
        }

        .orbital-shell {
            position: relative;
            --orbit-duration: 28s;
        }

        @property --orbit-pulse {
            syntax: "<length>";
            inherits: false;
            initial-value: 0px;
        }

        .orbital-ring {
            position: absolute;
            inset: 12%;
            border-radius: 999px;
            border: 2px dashed rgba(136, 0, 21, 0.45);
            opacity: 0;
            transition: opacity 0.6s ease;
            animation: spin-reverse 60s linear infinite;
        }

        .orbital-ring.inner {
            inset: 28%;
            border-style: solid;
            border-color: rgba(176, 106, 106, 0.35);
            border-width: 2px;
            opacity: 0.8;
            animation: spin-reverse 80s linear infinite;
        }

        .orbital-shell:hover .orbital-ring {
            opacity: 1;
        }

        .orbital-center {
            position: absolute;
            inset: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(176, 106, 106, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        .orbital-shell:hover .orbital-center {
            transform: translate(-50%, -50%) scale(0.92);
            opacity: 0.7;
        }

        .orbital-option {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 120px;
            height: 120px;
            border-radius: 999px;
            background: linear-gradient(145deg, rgba(20, 38, 31, 0.9), rgba(12, 28, 21, 0.8));
            border: 1px solid rgba(107, 142, 107, 0.35);
            box-shadow: 0 12px 30px rgba(12, 28, 21, 0.35);
            opacity: 0;
            transition: opacity 0.6s ease, box-shadow 0.6s ease;
            transition-delay: var(--delay, 0ms);
            animation: orbit var(--orbit-duration) linear infinite, orbit-pulse 6s ease-in-out infinite;
            animation-delay: var(--delay, 0ms), var(--delay, 0ms);
            transform: translate(-50%, -50%) rotate(var(--angle)) translateX(calc(var(--radius-current, 140px) + var(--orbit-pulse)));
            pointer-events: none;
        }

        .orbital-option:hover {
            box-shadow: 0 18px 40px rgba(12, 28, 21, 0.5);
        }

        .orbital-option .orbital-label {
            font-size: 11px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            color: #E8EFEA;
        }

        .orbital-option .orbital-glow {
            position: absolute;
            inset: 8px;
            border-radius: 999px;
            background: radial-gradient(circle at 30% 30%, rgba(107, 142, 107, 0.25), transparent 70%);
            opacity: 0.8;
        }

        .orbital-option-inner {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: counter-orbit var(--orbit-duration) linear infinite;
            animation-delay: var(--delay, 0ms);
            transform: rotate(calc(-1 * var(--angle)));
        }

        .orbital-option-contents {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 16px;
            transform: scale(0.85);
            transition: transform 0.4s ease;
        }

        .dark .orbital-option {
            background: #FFFFFF;
            border-color: rgba(136, 0, 21, 0.4);
            box-shadow: 0 12px 30px rgba(12, 28, 21, 0.35);
        }

        .dark .orbital-option .orbital-label {
            color: #880015;
        }

        .orbital-shell:hover .orbital-option {
            opacity: 1;
            pointer-events: auto;
        }

        .orbital-shell:hover .orbital-option-contents {
            transform: scale(1);
        }

        @media (min-width: 640px) {
            .orbital-center {
                width: 150px;
                height: 150px;
            }

            .orbital-option {
                width: 140px;
                height: 140px;
            }

            .orbital-option {
                --radius-current: var(--radius-sm, 190px);
            }
        }

        .orbital-option {
            --radius-current: var(--radius, 140px);
        }

        dialog::backdrop {
            background: rgba(12, 28, 21, 0.35);
            backdrop-filter: blur(10px);
        }

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        @keyframes orbit {
            from {
                transform: translate(-50%, -50%) rotate(var(--angle)) translateX(var(--radius-current, 140px));
            }
            to {
                transform: translate(-50%, -50%) rotate(calc(360deg + var(--angle))) translateX(var(--radius-current, 140px));
            }
        }

        @keyframes orbit-pulse {
            0%, 100% {
                --orbit-pulse: -18px;
            }
            50% {
                --orbit-pulse: 18px;
            }
        }

        @keyframes counter-orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        @keyframes dock-pulse {
            0% {
                transform: scale(1);
            }
            35% {
                transform: scale(1.08);
            }
            100% {
                transform: scale(1);
            }
        }

        .fireflies {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .firefly {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: rgba(107, 142, 107, 0.35);
            opacity: 0;
            animation: drift 14s ease-in-out infinite;
        }

        .dark .firefly {
            background: #D1E8D1;
            box-shadow: 0 0 12px rgba(209, 232, 209, 0.8);
        }

        @keyframes drift {
            0% {
                transform: translate3d(0, 0, 0) scale(0.8);
                opacity: 0;
            }
            20% {
                opacity: 0.7;
            }
            50% {
                transform: translate3d(20px, -30px, 0) scale(1);
                opacity: 0.9;
            }
            80% {
                opacity: 0.4;
            }
            100% {
                transform: translate3d(-10px, 20px, 0) scale(0.9);
                opacity: 0;
            }
        }
    </style>
</head>

        function initRunawayContact() {
            const existing = document.getElementById('runaway-contact');
            if (!existing) {
                return;
            }

            const button = existing;
            const safePadding = 140;
            const snapPoints = [
                { x: 0.3, y: 0.25 },
                { x: 0.7, y: 0.25 },
                { x: 0.32, y: 0.6 },
                { x: 0.68, y: 0.6 },
                { x: 0.5, y: 0.4 },
                { x: 0.5, y: 0.7 }
            ];

            function clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }

            function placeButton(point) {
                const rect = button.getBoundingClientRect();
                const maxX = window.innerWidth - rect.width - safePadding;
                const maxY = window.innerHeight - rect.height - safePadding;
                const targetX = clamp(point.x * window.innerWidth, safePadding, maxX);
                const targetY = clamp(point.y * window.innerHeight, safePadding, maxY);
                button.style.left = `${targetX}px`;
                button.style.top = `${targetY}px`;
            }

            let attemptCount = 0;
            let isCatchable = false;

            function hop() {
                const point = snapPoints[Math.floor(Math.random() * snapPoints.length)];
                placeButton(point);
            }

            function settle() {
                const footerActions = document.getElementById('footer-actions');
                if (!footerActions) {
                    placeButton({ x: 0.82, y: 0.2 });
                    return;
                }
                button.classList.add('is-docked');
                button.style.left = '';
                button.style.top = '';
                footerActions.insertBefore(button, footerActions.firstChild);
            }

            placeButton({ x: 0.75, y: 0.58 });

            document.addEventListener('mousemove', (event) => {
                const rect = button.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const dx = event.clientX - centerX;
                const dy = event.clientY - centerY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 120 && !isCatchable) {
                    attemptCount += 1;
                    if (attemptCount >= 50) {
                        isCatchable = true;
                        button.classList.add('is-caught');
                        settle();
                        return;
                    }
                    hop();
                }
            });

            button.addEventListener('click', (event) => {
                if (!isCatchable) {
                    event.preventDefault();
                    attemptCount += 1;
                    if (attemptCount >= 50) {
                        isCatchable = true;
                        button.classList.add('is-caught');
                        settle();
                        return;
                    }
                    hop();
                } else {
                    if (!document.documentElement.classList.contains('dark')) {
                        toggleTheme();
                    }
                }
            });

            window.addEventListener('resize', () => {
                hop();
            });
        }

        // Initialize Tilt Animation for Cards
        function initTilt() {
            const cards = document.querySelectorAll('.tilt-card');
            
            cards.forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    const rotateX = ((y - centerY) / centerY) * -5; // Max 5deg tilt
                    const rotateY = ((x - centerX) / centerX) * 5;

                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                });

                card.addEventListener('mouseleave', () => {
                    card.style.transform = `perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)`;
                });
            });
        }

        function applyOrbitRate(rate) {
            orbitRate = rate;
            const animatedNodes = document.querySelectorAll('.orbital-option, .orbital-option-inner');
            const animations = [];
            animatedNodes.forEach(node => {
                animations.push(...node.getAnimations());
            });
            animations.forEach(anim => {
                anim.playbackRate = rate;
            });
        }

        function smoothOrbitRate(targetRate) {
            const startRate = orbitRate;
            const duration = 600;
            const start = performance.now();

            if (orbitTweenId) {
                cancelAnimationFrame(orbitTweenId);
            }

            function tick(now) {
                const elapsed = now - start;
                const t = Math.min(elapsed / duration, 1);
                const eased = t * (2 - t);
                const rate = startRate + (targetRate - startRate) * eased;
                applyOrbitRate(rate);
                if (t < 1) {
                    orbitTweenId = requestAnimationFrame(tick);
                }
            }

            orbitTweenId = requestAnimationFrame(tick);
        }

                                        <span class="font-mono text-[10px] uppercase tracking-widest text-forest-moss">0${i+1}</span>
                                    </div>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // --- PHOTOGRAPHY: COLOUR ---
            else if (view === 'photography-colour') {
                html = `
                    <div class="animate-fade-in max-w-6xl mx-auto pt-8 md:pt-12">
                        <header class="mb-12 border-b border-forest-moss/10 pb-6 flex flex-col md:flex-row md:items-end md:justify-between gap-4">
                            <div>
                                <h2 class="text-4xl md:text-5xl font-serif mb-3 text-forest-mist">Colour</h2>
                                <p class="text-forest-stone text-lg font-light">Warm tones and balanced grain.</p>
                            </div>
                            <button onclick="renderContent('photography')" class="text-xs font-mono uppercase tracking-widest text-forest-moss hover:text-forest-mist transition-colors">Back to folders</button>
                        </header>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                            ${DATA.photography.color.map((p, i) => `
                                <button onclick="openImage('${encodeURIComponent(p.title)}','${encodeURIComponent(p.img)}')" class="group relative overflow-hidden aspect-square bg-forest-surface shadow-lg tilt-card hover-trigger text-left">
                                    <div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105"
                                        style="background-image: url('${p.img}');">
                                    </div>
                                    <div class="absolute inset-0 bg-gradient-to-t from-forest-base/80 via-transparent to-transparent"></div>
                                    <div class="absolute bottom-0 left-0 p-4">
                                        <span class="font-mono text-[10px] uppercase tracking-widest text-forest-moss">0${i+1}</span>
                                    </div>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // --- INNOVATION ---
            else if (view === 'innovation') {
                 html = `
                    <div class="animate-fade-in max-w-4xl mx-auto pt-8 md:pt-12">
                        <header class="mb-16 text-center">
                            <i data-lucide="sprout" class="w-12 h-12 text-forest-moss mx-auto mb-6 opacity-80"></i>
                            <h2 class="text-4xl md:text-5xl font-serif mb-6 text-forest-mist">The Greenhouse</h2>
                            <p class="text-forest-stone text-lg font-light max-w-xl mx-auto">
                                Early experiments and prototypes in progress.
                            </p>
                        </header>

                        <div class="grid md:grid-cols-2 gap-8">
                            <!-- Card 1 -->
                            <div class="glass-forest p-8 rounded-sm hover:translate-y-[-4px] transition-transform duration-500 tilt-card">
                                <div class="flex justify-between items-start mb-6">
                                    <span class="font-mono text-xs text-forest-moss border border-forest-moss/20 px-2 py-1 rounded">ACTIVE</span>
                                    <i data-lucide="brain-circuit" class="w-6 h-6 text-forest-stone"></i>
                                </div>
                                <h3 class="text-2xl font-serif text-forest-mist mb-4">Semantic Search</h3>
                                <p class="text-forest-stone font-light text-sm leading-relaxed mb-8">
                                    Private semantic search for offline documents.
                                </p>
                                <div class="w-full h-1 bg-forest-moss/10 rounded-full overflow-hidden">
                                    <div class="w-2/3 h-full bg-forest-moss/50"></div>
                                </div>
                                <div class="mt-2 text-right text-xs font-mono text-forest-stone">65% Complete</div>
                            </div>

                             <!-- Card 2 -->
                            <div class="glass-forest p-8 rounded-sm hover:translate-y-[-4px] transition-transform duration-500 tilt-card">
                                <div class="flex justify-between items-start mb-6">
                                    <span class="font-mono text-xs text-forest-timber border border-forest-timber/20 px-2 py-1 rounded">DORMANT</span>
                                    <i data-lucide="calendar-clock" class="w-6 h-6 text-forest-stone"></i>
                                </div>
                                <h3 class="text-2xl font-serif text-forest-mist mb-4">Calendar Agent</h3>
                                <p class="text-forest-stone font-light text-sm leading-relaxed mb-8">
                                    Automated scheduling to reduce back-and-forth.
                                </p>
                                <div class="w-full h-1 bg-forest-moss/10 rounded-full overflow-hidden">
                                    <div class="w-1/4 h-full bg-forest-timber/50"></div>
                                </div>
                                <div class="mt-2 text-right text-xs font-mono text-forest-stone">25% Complete</div>
                            </div>
                        </div>
                    </div>
                 `;
            }

            container.innerHTML = html;
            lucide.createIcons();
            
            // Re-initialize tilt for new elements
            initTilt();
            initCustomCursor();
            if (view === 'home') {
                initRunawayContact();
                applyOrbitRate(orbitRate);
            }
        }

        /* --- INIT --- */
        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('year').innerText = new Date().getFullYear();
            await loadMedia();
            renderContent('home');
            initModalBackdropClose();
            initCustomCursor();
            initFireflies();
            initBondSwitches();
        });

    </script>
</body>
</html>
